name: Build Ghidra extension (Windows)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 27
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'

      - name: Download Ghidra 12.2
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ghidra_12.2_PUBLIC_20261016.zip'
          $uri = 'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip'
          Invoke-WebRequest -Uri $uri -OutFile $archive
          Expand-Archive $archive $env:RUNNER_TEMP -Force
          echo "GHIDRA_INSTALL_DIR=$env:RUNNER_TEMP\ghidra_12.2_PUBLIC" >> $env:GITHUB_ENV

      - name: Set up Ghidra-compatible Gradle
        shell: pwsh
        run: |
          $properties = Join-Path $env:GHIDRA_INSTALL_DIR 'Ghidra/application.properties'
          $match = Select-String -Path $properties -Pattern '^application\.gradle\.version=(.+)$'
          if (-not $match) {
            throw "Could not find application.gradle.version in $properties"
          }

          $gradleVersion = $match.Matches[0].Groups[1].Value.Trim()
          echo "GRADLE_VERSION=$gradleVersion" >> $env:GITHUB_ENV
          echo "Using Gradle $gradleVersion"

      - name: Download and use Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Verify Java
        shell: pwsh
        run: |
          java -version
          gradle --version

      - name: Build extension
        run: gradle buildExtension

      - name: Upload extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-nodejs-extension
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
